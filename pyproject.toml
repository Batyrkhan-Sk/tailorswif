[project]
name = "tailorswif"
version = "0.1.0"
description = "Controlled surrealism, phase 0: the Deadpan Test and a pairwise ranking tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fal-client>=1.0.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.5",
]

[project.scripts]
tailorswif = "tailorswif:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
